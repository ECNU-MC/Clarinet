plugins {
	id 'java'
}

group = 'org.ecnumc'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

dependencies {
    implementation group: 'io.agentscope', name: 'agentscope-harness', version: '2.0.0-RC3'

    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.26.0'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.26.0'

    implementation 'com.baomidou:mybatis-plus:3.5.16'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'

    implementation 'org.jsoup:jsoup:1.21.2'

    implementation 'org.jetbrains:annotations:24.1.0'

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    implementation group: 'com.google.guava', name: 'guava', version: '31.1-jre'

    implementation group: 'com.alibaba', name: 'fastjson', version: '2.0.60'

    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    implementation('org.mapstruct:mapstruct:1.6.3')
    annotationProcessor('org.mapstruct:mapstruct-processor:1.6.3')
    annotationProcessor('org.projectlombok:lombok-mapstruct-binding:0.2.0')

    testCompileOnly("org.projectlombok:lombok:1.18.42")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.42")
    testAnnotationProcessor('org.mapstruct:mapstruct-processor:1.6.3')
    testAnnotationProcessor('org.projectlombok:lombok-mapstruct-binding:0.2.0')
}

tasks.named('test') {
	useJUnitPlatform()
}

javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}
